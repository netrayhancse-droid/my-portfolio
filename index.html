<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayhan | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons for Phone, Mail, LinkedIn, GitHub, Facebook -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header class="navbar">
        <div class="logo">Rayhan</div>
        <div class="menu-icon"><i class="fas fa-bars"></i></div>
    </header>

    <!-- Main Hero Section -->
    <section class="hero">
        <div class="profile-card">
            <!-- Profile Image -->
            <div class="img-container">
                <img src="profile.jpg" alt="Rayhan">
            </div>

            <!-- Name and Title -->
            <h1>Rayhan</h1>
            <h3>Network Engineer & System Administrator</h3>
            <p class="tagline">"Building networks that never break. Leading systems to self-heal."</p>

            <!-- Social Media Icons -->
            <div class="social-icons">
                <a href="tel:+8801700000000" title="Phone"><i class="fas fa-phone"></i></a>
                <a href="mailto:your-email@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
                <a href="https://linkedin.com/in/yourprofile" target="_blank" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://github.com/yourusername" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://facebook.com/yourprofile" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            </div>

            <!-- Action Buttons -->
            <div class="cta-buttons">
                <a href="mailto:your-email@gmail.com" class="btn btn-primary">Get In Touch</a>
                <a href="#" class="btn btn-secondary">Download CV</a>
            </div>
        </div>
    </section>

</body>
</html>
